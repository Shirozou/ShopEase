<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-label="ShopEase three layer frontend architecture">
 <rect width="960" height="670" fill="#f8f7f4"/>
 <g font-family="Arial,sans-serif" fill="#262823"><text x="70" y="66" font-size="34" font-weight="bold">ShopEase</text><text x="70" y="96" font-size="15" fill="#777971">Three-layer frontend system architecture</text></g>
 <g font-family="Arial,sans-serif" text-anchor="middle">
 <rect x="175" y="133" width="610" height="127" rx="12" fill="#e8ede5" stroke="#98a88f"/><text x="480" y="166" fill="#455a40" font-size="17" font-weight="bold">01 · PRESENTATION LAYER</text><text x="480" y="197" fill="#262823" font-size="16">React pages and responsive storefront UI</text><text x="480" y="225" fill="#5e665c" font-size="13">Header · Product cards · Shop · Cart · Checkout · Confirmation</text>
 <path d="M480 260 V311" fill="none" stroke="#566545" stroke-width="3"/><path d="M471 301 L480 313 L489 301" fill="none" stroke="#566545" stroke-width="3"/>
 <rect x="175" y="317" width="610" height="127" rx="12" fill="#f0ebdf" stroke="#c6b895"/><text x="480" y="350" fill="#7b6849" font-size="17" font-weight="bold">02 · APPLICATION LOGIC LAYER</text><text x="480" y="381" fill="#262823" font-size="16">Product filtering · Cart Context · Form validation</text><text x="480" y="409" fill="#686358" font-size="13">Quantity updates · Subtotal · Simulated order workflow</text>
 <path d="M480 444 V494" fill="none" stroke="#566545" stroke-width="3"/><path d="M471 484 L480 496 L489 484" fill="none" stroke="#566545" stroke-width="3"/>
 <rect x="175" y="500" width="610" height="127" rx="12" fill="#e8e9ec" stroke="#a5a7b2"/><text x="480" y="533" fill="#555965" font-size="17" font-weight="bold">03 · DATA LAYER</text><text x="480" y="564" fill="#262823" font-size="16">Static product catalog + local illustrations</text><text x="480" y="591" fill="#5e616b" font-size="13">localStorage (cart) · sessionStorage (latest demo order)</text>
 </g>
</svg>
